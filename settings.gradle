pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // Provisions the JDK 21 toolchain Minecraft 1.21 needs, and the JDK 17 one the included vscript build asks for.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'bpm'

/*
 * **vscript is a git submodule (`vscript/`), built as part of this build.** Edits to the language, the runtime or the
 * canvas are picked up on the next `gradlew` run with no publish step.
 *
 * The substitutions are stated explicitly, and the first one is load-bearing: the language module is
 * `:vscript-lang` but its artifact is `io.osrsx:osrsx-vscript` (see vscript-lang/build.gradle), and
 * includeBuild's automatic matching goes by the project's own coordinates. Without the line the dependency
 * silently resolves to whatever stale jar mavenLocal holds and fails as a page of unresolved references.
 */
includeBuild('vscript') {
    dependencySubstitution {
        substitute module('io.osrsx:osrsx-vscript') using project(':vscript-lang')
        substitute module('io.osrsx:vscript-runtime') using project(':vscript-runtime')
        substitute module('io.osrsx:vscript-ui') using project(':vscript-ui')
        substitute module('io.osrsx:vscript-runview') using project(':vscript-runview')
        substitute module('io.osrsx:editor-host') using project(':editor-host')
        substitute module('io.osrsx:editor-graph') using project(':editor-graph')
    }
}
