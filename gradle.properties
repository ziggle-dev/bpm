org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true

# KotlinForForge supplies the Kotlin runtime (stdlib) at compile and run time; the Kotlin plugin must not add
# its own, or the mod's runtime classpath carries two stdlibs and FML's module layer refuses one of them.
kotlin.stdlib.default.dependency=false

mod_id=bpm
mod_version=0.1.0
neo_version=21.1.249
kff_version=5.12.0
kotlin_runtime_version=2.4.0
vscript_version=1.2.0
imgui_version=1.90.0
geckolib_version=4.9.2
# Dev runs only (never shipped, never compiled against): a big energy/fluid mod to test the transfer verbs against.
mekanism_version=1.21.1-10.7.19.85
jei_version=19.44.0.413
# Just Dire Things is CurseForge-only: the CurseMaven proxy names a file by project id and file id (JustDireThings-1.5.7).
justdirethings_curse=just-dire-things-1002348:7463040
# Tag & Component Tooltips from the Modrinth Maven, by version id (1.1.2; the number alone is shared across game versions).
tact_version=6xyIJkVx

# Ponder: the in-game scene tutorials, split out of Create as its own library. Needs Flywheel at runtime.
ponder_version=1.0.69
flywheel_version=1.0.6-44
catnip_version=0.8.54
