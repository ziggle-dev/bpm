# Sized for what this build is becoming, not what it is. The version ladder ends at roughly two dozen
# Gradle projects sharing one daemon; 3g of heap and 768m of metaspace do not survive that. Raising it
# early costs nothing on a machine with room and saves diagnosing an OOM as a build bug later.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true

# KotlinForForge supplies the Kotlin runtime (stdlib) at compile and run time; the Kotlin plugin must not add
# its own, or the mod's runtime classpath carries two stdlibs and FML's module layer refuses one of them.
kotlin.stdlib.default.dependency=false

# The Minecraft version this build targets.
#
# Every artifact coordinate that names it is assembled from this rather than spelling it out -- GeckoLib,
# JEI, Ponder and Flywheel all put the game version in their group or artifact id, so "1.21.1" appeared in
# nine separate strings. Moving a node up the ladder is now one line here. Under Stonecutter this becomes
# a per-target value and none of the call sites change.
minecraft_version=1.21.1

mod_id=bpm
mod_version=0.2.1
# NeoForge is versioned per Minecraft version, so there is one of these per node. The build script picks
# by `stonecutter.current.version`; a node with no entry fails loudly rather than silently using another
# version's platform, which Loom would have let happen.
neo_version_1_21_1=21.1.249
neo_version_1_21_4=21.4.157
neo_version_1_21_11=21.11.45
# Kotlin for Forge. One version covers both nodes, which was NOT the original guess.
#
# The split is by MINECRAFT version and nothing else: the constraint lives in `kffmod-neoforge`'s
# `neoforge.mods.toml` (not in the `kotlinforforge-neoforge` artifact this build names, which is a
# jar-in-jar shell with no metadata at all), and it reads `[1.20.6,1.21.9)` for 5.12.0 against
# `[1.21.9,1.22)` for 6.0.0. So the 6.x line is 1.21.9 AND UP, not "1.21.4 and up" — pointing 1.21.4 at
# 6.0.0 aborted mod loading before the title screen with "requires minecraft 1.21.9 or above".
#
# 5.12.0 bundles Kotlin 2.4.0, satisfying the mod's 2.3 API ceiling and vscript's 2.3.21 build, and
# declares no NeoForge range at all, so 21.1.249 and 21.4.157 are both fine. Verified by launching both.
kff_version_1_21_1=5.12.0
kff_version_1_21_4=5.12.0
# 1.21.11 is where the 6.x line begins -- its minecraft range is [1.21.9,26.3).
kff_version_1_21_11=6.3.0
# Fabric. FLK is the counterpart of KFF: it supplies the Kotlin runtime in a player's game, and 1.13.13
# bundles Kotlin 2.4.10, which satisfies both this mod's 2.3 API ceiling and vscript's 2.3.21 build.
fabric_loader_version=0.19.5
# Fabric API is published per Minecraft version and the build number does not carry across, so this is
# per node like NeoForge's own. FLK is not: one artifact covers the whole ladder.
fabric_api_version_1_21_1=0.116.17+1.21.1
fabric_api_version_1_21_4=0.119.4+1.21.4
fabric_api_version_1_21_11=0.141.6+1.21.11
flk_version=1.13.13+kotlin.2.4.10
# Team Reborn's Energy API — Fabric's de-facto standard for energy, since Fabric API itself has none.
# Per node, like the others: 4.1.0 covers 1.21.x, 4.2.0 wants 1.21.5+, and 5.0.0 needs Java 25 (the 26.x
# band). Hosted on modmuss50's maven, NOT TerraformersMC's, which is where its docs point.
energy_api_version_1_21_1=4.1.0
energy_api_version_1_21_4=4.1.0
# 4.2.0 is the last line built for the obfuscated era: Java 21, Minecraft >=1.21.5.
# 5.0.0 targets 26.1+/Java 25 and ships without an intermediary namespace, so Loom
# refuses to remap it against 1.21.11.
energy_api_version_1_21_11=4.2.0
kotlin_runtime_version=2.4.0
vscript_version=1.2.0
imgui_version=1.90.0
# GeckoLib is published per Minecraft version and the version numbers do not track each other: 1.21.1 is
# on 4.9.x while 1.21.4 stopped at 4.8.x. One entry per node, like NeoForge.
geckolib_version_1_21_1=4.9.2
# GeckoLib's numbering does not track Minecraft's: 1.21.1 is on 4.9.x while 1.21.4 stopped at 4.8.5.
geckolib_version_1_21_4=4.8.5
# 1.21.11 is on the 5.x line: the GeoRenderState rewrite.
geckolib_version_1_21_11=5.4.5
# Dev runs only (never shipped, never compiled against): a big energy/fluid mod to test the transfer verbs against.
mekanism_version=1.21.1-10.7.19.85
jei_version=19.44.0.413
# Just Dire Things is CurseForge-only: the CurseMaven proxy names a file by project id and file id (JustDireThings-1.5.7).
justdirethings_curse=just-dire-things-1002348:7463040
# Tag & Component Tooltips from the Modrinth Maven, by version id (1.1.2; the number alone is shared across game versions).
tact_version=6xyIJkVx

# Ponder: the in-game scene tutorials, split out of Create as its own library. Needs Flywheel at runtime.
ponder_version=1.0.69
flywheel_version=1.0.6-44
catnip_version=0.8.54
