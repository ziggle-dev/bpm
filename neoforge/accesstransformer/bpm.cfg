# The GpuTexture behind a loaded texture.
#
# The NeoForge counterpart of fabric/accesswidener/bpm.accesswidener, and scoped the same way:
# 1.21.5-1.21.8 only. Below 1.21.5 the field does not exist, because textures were still OpenGL names;
# from 1.21.9 `AbstractTexture` exposes `getTexture()` publicly and nothing needs widening.
#
# Wanted so ImGui can be handed a handle for something the game already has on the GPU -- the atlas an
# item thumbnail is drawn from, a player's skin for a head icon.
public net.minecraft.client.renderer.texture.AbstractTexture texture
