# The pieces a custom RenderType is built from, on 1.20.1.
#
# The counterpart of fabric/accesswidener/bpm-1.20.1.accesswidener, and scoped the same way: 1.20.1
# alone. From 1.21.5 the render pipeline was rebuilt and none of this is how a render type is described
# any more; on the bands between, NeoForge's own transformer already opens them.
#
# `RenderType.CompositeState`, its builder and the state shards are declared PROTECTED -- nested classes
# meant for RenderType's own subclasses -- and the static shard instances with them. Worth knowing if
# this ever looks wrong: `javap` reports the classes as PUBLIC, because a class file carries its access
# twice, once in its own flags and once in the enclosing class's InnerClasses attribute. The compiler
# honours the latter, which says protected.
#
# Written in Mojang names, like the other file beside it: ModDevGradle's legacy path develops against
# Mojang mappings and converts the transformer for the production jar.
